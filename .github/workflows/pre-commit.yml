name: pre-commit

on: [push, pull_request]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/key4hep/key4hep-images/alma9-cvmfs
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: edm4hep
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: AIDASoft/podio
        path: podio
    - name: Mount CVMFS
      run: /mount.sh
    - name: Build podio and run pre-commit
      run: |
          source /cvmfs/sw-nightlies.hsf.org/key4hep/setup.sh
          STARTDIR=$(pwd)
          echo "::group::Build podio"
          cd ${STARTDIR}/podio
          # Newer versions of git are more cautious around the github runner
          # environment and without this git rev-parse --show-cdup in pre-commit
          # fails
          git config --global --add safe.directory $(pwd)
          echo "Building podio @"$(git log -1 --format=%H)
          cmake -DCMAKE_CXX_STANDARD=20 \
            -DENABLE_SIO=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install \
            -G Ninja -B build
          cmake --build build --target install
          source init.sh && source env.sh
          echo "::endgroup::"
          echo "::group::Run pre-commit"
          cd ${STARTDIR}/edm4hep
          git config --global --add safe.directory $(pwd)
          python3 -m venv /root/pre-commit-venv
          source /root/pre-commit-venv/bin/activate
          pre-commit run --show-diff-on-failure \
            --color=always \
            --all-files
          echo "::endgroup::"
