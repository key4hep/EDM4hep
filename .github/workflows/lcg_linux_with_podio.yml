name: lcg_linux_with_podio

on: [push, pull_request]

jobs:
  build-and-test-with-podio:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        LCG: ["dev4/x86_64-el9-gcc13-opt",
              "LCG_106/x86_64-el9-gcc13-opt"]
        CXX_STANDARD: [20]
        include:
          - {LCG: "dev3/x86_64-el9-clang22-opt", CXX_STANDARD: 23}
          - {LCG: "dev4/x86_64-el9-clang22-opt", CXX_STANDARD: 23}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: AIDASoft/podio
        path: podio
    - uses: key4hep/key4hep-actions/cache-external-data@main
    - uses: cvmfs-contrib/github-action-cvmfs@10197e000cc0add8e54ac4fb73d3ed44e2de72b4 # v5.5
    - uses: aidasoft/run-lcg-view@b4da52e1c5ccb70a60ad4e7216de0a90664d5849 # v6.0.2
      with:
        release-platform: ${{ matrix.LCG }}
        ccache-key: ccache-${{ matrix.LCG }}
        run: |
          STARTDIR=$(pwd)
          echo "::group::Build podio"
          cd podio
          echo "Building podio @"$(git log -1 --format=%H)
          cmake -DCMAKE_CXX_STANDARD=${{ matrix.CXX_STANDARD }} \
            -DENABLE_SIO=ON \
            -DENABLE_RNTUPLE=ON \
            -DENABLE_DATASOURCE=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja -B build
          cmake --build build --target install -- -k0
          source init.sh && source env.sh
          echo "::endgroup::"
          echo "::group::Build edm4hep"
          cd $STARTDIR
          echo "Building edm4hep"
          cmake -DCMAKE_CXX_STANDARD=${{ matrix.CXX_STANDARD }} \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install \
            -DUSE_EXTERNAL_CATCH2=OFF \
            -G Ninja -B build
          cmake --build build -- -k0
          ctest --test-dir build --output-on-failure
          cmake --build build --target install
          echo "::endgroup::"
          echo "::group::Test downstream usage"
          export CMAKE_PREFIX_PATH=$PWD/install:$CMAKE_PREFIX_PATH
          cd test/downstream-project-cmake-test
          cmake -DCMAKE_CXX_STANDARD=${{ matrix.CXX_STANDARD }} \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja -B build
          cmake --build build -- -k0
          echo "::endgroup::"
