name: lcg_linux_with_podio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test-with-podio:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/key4hep/key4hep-images/alma9-cvmfs
      options: --privileged
      volumes:
        - /home/runner/.cache/ccache:/root/.cache/ccache
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: /root/.cache/ccache
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime
    strategy:
      fail-fast: false
      matrix:
        LCG: ["dev4/x86_64-el9-gcc13-opt",
              "LCG_106/x86_64-el9-gcc13-opt"]
        CXX_STANDARD: [20]
        include:
          - {LCG: "dev3/x86_64-el9-clang22-opt", CXX_STANDARD: 23}
          - {LCG: "dev4/x86_64-el9-clang22-opt", CXX_STANDARD: 23}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: AIDASoft/podio
        path: podio
    - uses: key4hep/key4hep-actions/cache-external-data@main
    - name: Mount CVMFS
      run: /mount.sh
    - name: Set cache date
      run: echo "NOW=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: /root/.cache/ccache
        key: ccache-${{ matrix.LCG }}-${{ env.NOW }}
        restore-keys: |
          ccache-${{ matrix.LCG }}
    - name: Build and test with podio
      env:
        LCG: ${{ matrix.LCG }}
      run: |
          if [[ "${LCG%%/*}" == dev* ]]; then
            source /cvmfs/sft-nightlies.cern.ch/lcg/views/${LCG%%/*}/latest/${LCG#*/}/setup.sh
          else
            source /cvmfs/sft.cern.ch/lcg/views/${LCG}/setup.sh
          fi
          ccache --set-config=max_size=500M
          ccache -z
          STARTDIR=$(pwd)
          echo "::group::Build podio"
          cd podio
          echo "Building podio @"$(git log -1 --format=%H)
          cmake -DCMAKE_CXX_STANDARD=${{ matrix.CXX_STANDARD }} \
            -DENABLE_SIO=ON \
            -DENABLE_RNTUPLE=ON \
            -DENABLE_DATASOURCE=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja -B build
          cmake --build build --target install -- -k0
          source init.sh && source env.sh
          echo "::endgroup::"
          echo "::group::Build edm4hep"
          cd $STARTDIR
          echo "Building edm4hep"
          cmake -DCMAKE_CXX_STANDARD=${{ matrix.CXX_STANDARD }} \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install \
            -DUSE_EXTERNAL_CATCH2=OFF \
            -G Ninja -B build
          cmake --build build -- -k0
          ctest --test-dir build --output-on-failure
          cmake --build build --target install
          echo "::endgroup::"
          echo "::group::Test downstream usage"
          export CMAKE_PREFIX_PATH=$PWD/install:$CMAKE_PREFIX_PATH
          cd test/downstream-project-cmake-test
          cmake -DCMAKE_CXX_STANDARD=${{ matrix.CXX_STANDARD }} \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja -B build
          cmake --build build -- -k0
          echo "::endgroup::"
          echo "::group::ccache statistics"
          ccache -s
          echo "::endgroup::"
